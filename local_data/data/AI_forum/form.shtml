<!DOCTYPE html>
<html lang="ja">

<body>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>AIサンプル</title>
        <link rel="stylesheet" type="text/css" href="css/style.css">
        <title>人工知能フォーラム || お問い合わせフォーム</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://ajaxzip3.github.io/ajaxzip3.js"></script> <!-- 住所自動補完用のライブラリ -->

    </head>

    <div id="particles-js"></div>
    <!-- Include header.ssi -->
    <!--#include virtual="header.ssi"-->
    <div id="wrapper">

        <div class="contact-form">
            <div class="form-main-block">
                <h1>人工知能フォーラムに関するお問い合わせ</h1>
            </div>
            <div class="form-input-block">
                <div class="form-block">
                    <form action="">
                        <!-- 他のフィールド -->
                        <div class="form-group">
                            <label for="furigana">フリガナ：<span class="red">必須</span></label>
                            <input type="text" id="furigana" name="furigana" required>
                        </div>
                        <div class="error-container">
                            <span id="furigana-error" class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="name">お名前：<span class="red">必須</span></label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="error-container">
                            <span id="name-error" class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="gender">性別：<span class="red">必須</span></label>
                            <div class="radio">
                                <div class="radiobutton_rw">
                                    <label for="male">男性</label>
                                    <input type="radio" id="male" name="gender" value="male">
                                </div>
                                <div class="radiobutton_rw">
                                    <label for="female">女性</label>
                                    <input type="radio" id="female" name="gender" value="female">
                                </div>
                            </div>
                        </div>
                        <div class="error-container">
                            <span id="gender-error" class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="organization">団体・会社名：<span class="red">必須</span></label>
                            <input type="text" id="organization" name="organization" required>
                        </div>
                        <div class="error-container">
                            <span id="organization-error" class="error-message"></span>
                        </div>

                        <div class="form-group">
                            <label for="postal_code">郵便番号：<span class="red">必須</span></label>
                            <input type="text" id="postal_code" name="postal_code"
                                onKeyUp="AjaxZip3.zip2addr(this,'address','address','address');" required>
                        </div>
                        <div class="error-container">
                            <span id="postal_code-error" class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="address">住所：<span class="red">必須</span></label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        <div class="error-container">
                            <span id="address-error" class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="building_name">建物名：</label>
                            <input type="text" id="building_name" name="building_name">
                        </div>
                        <div class="form-group">
                            <label for="room_number">部屋番号：</label>
                            <input type="text" id="room_number" name="room_number">
                        </div>
                        <!-- 隠しフィールド -->
                        <input type="hidden" id="full_address" name="full_address">
                        <div class="form-group">
                            <label for="phone">電話番号：<span class="red">必須</span></label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                        <div class="error-container">
                            <span id="phone-error" class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">メールアドレス：<span class="red">必須</span></label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="error-container">
                            <span id="email-error" class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="category">お問い合わせの分類：</label>
                            <div class="checkbox">
                                <div class="checkbox_rw">
                                    <label for="category1" class="checkbox_label">一般</label>
                                    <input type="checkbox" id="category1" name="category[]" value="一般">
                                </div>
                                <div class="checkbox_rw">
                                    <label for="category2" class="checkbox_label">技術</label>
                                    <input type="checkbox" id="category2" name="category[]" value="技術">
                                </div>
                                <div class="checkbox_rw">
                                    <label for="category3" class="checkbox_label">請求</label>
                                    <input type="checkbox" id="category3" name="category[]" value="請求">
                                </div>
                                <div class="checkbox_rw">
                                    <label for="category4" class="checkbox_label">その他</label>
                                    <input type="checkbox" id="category4" name="category[]" value="その他">
                                </div>
                            </div>
                        </div>
                        <div class="error-container">
                            <span id="category-error" class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="message">お問い合わせ内容：<span class="red">必須</span></label>
                            <textarea id="message" name="message" rows="10" required></textarea>
                        </div>
                        <div class="error-container">
                            <span id="message-error" class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="file">ファイルアップロード：</label>
                            <input type="file" id="file" name="file" accept=".pdf,.doc,.docx">
                        </div>
                        <div class="button_block">
                            <button class="contact_button" type="submit">確認</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- Include footer.ssi -->
        <!--#include virtual="footer.ssi"-->

        <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
        <script src="js/particle.js"></script>
        <script>
            function combineAddress() {
                var postalCode = document.getElementById('postal_code').value;
                var address = document.getElementById('address').value;
                var buildingName = document.getElementById('building_name').value;
                var roomNumber = document.getElementById('room_number').value;
                var fullAddress = '〒' + postalCode + ' ' + address;
                if (buildingName) {
                    fullAddress += ' ' + buildingName;
                }
                if (roomNumber) {
                    fullAddress += ' ' + roomNumber;
                }
                document.getElementById('full_address').value = fullAddress;
            }
        </script>
        <script src="js/form.js"></script>
    </div>
</body>

</html>
